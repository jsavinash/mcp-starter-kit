site_name: MCP Starter Kit
site_description: Python monorepo starter for Model Context Protocol servers
repo_name: jsavinash/mcp-starter-kit
repo_url: https://github.com/jsavinash/mcp-starter-kit

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.tracking
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Project structure: project-structure.md
  - Architecture & MCP:
      - Architecture: architecture.md
      - Capabilities: capabilities.md
      - Transports: transports.md
  - Configuration: configuration.md
  - Development:
      - Development guide: development.md
      - Testing & CI: testing.md
      - Troubleshooting: troubleshooting.md
  - Operations:
      - Security: operations/security.md
      - Deployment: operations/deployment.md
  - Reference:
      - Python packages: api-reference.md
      - Codex project setup: codex.md
