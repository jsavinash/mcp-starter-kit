[project]
name = "mcp-starter-kit"
version = "0.1.0"
description = "Production-oriented Python monorepo starter for Model Context Protocol servers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp-example-server"]

[dependency-groups]
dev = [
    "mcp[cli]>=2.0,<3",
    "mypy>=1.16,<2",
    "pip-audit>=2.7,<3",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5,<8",
    "ruff>=0.11,<1",
]
docs = [
    "mkdocs-material>=9.6,<10",
    "mkdocstrings[python]>=0.25,<2",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["apps/*", "libs/*"]

[tool.uv.sources]
mcp-example-server = { workspace = true }
mcp-starter-core = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apps/example-server/src", "libs/mcp-starter-core/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["apps/example-server/src", "libs/mcp-starter-core/src"]
